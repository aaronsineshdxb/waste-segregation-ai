[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "waste-segregation-ai"
version = "0.1.0"
description = "AI-powered waste segregation assistant for Grade 12 capstone project"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Aaron", email = "aaron@example.com"},
    {name = "Nishanth", email = "nishanth@example.com"},
    {name = "Sidardh", email = "sidardh@example.com"},
    {name = "Safa", email = "safa@example.com"},
    {name = "Sidhiksha", email = "sidhiksha@example.com"},
]
maintainers = [
    {name = "Aaron", email = "aaron@example.com"},
]
keywords = ["waste", "segregation", "computer-vision", "tensorflow", "streamlit", "education", "capstone"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Recognition",
]
requires-python = ">=3.10,<3.13"
dependencies = [
    "tensorflow>=2.15.0,<2.16.0",
    "keras>=3.0.0,<4.0.0",
    "opencv-python>=4.9.0,<5.0.0",
    "Pillow>=10.0.0,<11.0.0",
    "numpy>=1.24.0,<2.0.0",
    "pandas>=2.1.0,<3.0.0",
    "scikit-learn>=1.3.0,<2.0.0",
    "scipy>=1.11.0,<2.0.0",
    "matplotlib>=3.7.0,<4.0.0",
    "seaborn>=0.13.0,<1.0.0",
    "plotly>=5.17.0,<6.0.0",
    "streamlit>=1.28.0,<2.0.0",
    "python-dotenv>=1.0.0,<2.0.0",
    "tqdm>=4.66.0,<5.0.0",
    "requests>=2.31.0,<3.0.0",
    "google-generativeai>=0.3.0,<1.0.0",
    "pyyaml>=6.0.0,<7.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0,<8.0.0",
    "black>=23.0.0,<24.0.0",
    "flake8>=6.1.0,<7.0.0",
    "mypy>=1.5.0,<2.0.0",
    "pre-commit>=3.5.0,<4.0.0",
    "pip-audit>=2.6.0,<3.0.0",
]

[project.urls]
Homepage = "https://github.com/aaronsineshdxb/waste-segregation-ai-"
Repository = "https://github.com/aaronsineshdxb/waste-segregation-ai-.git"
Issues = "https://github.com/aaronsineshdxb/waste-segregation-ai-/issues"
Documentation = "https://github.com/aaronsineshdxb/waste-segregation-ai-/tree/main/docs"

[tool.setuptools.packages.find]
where = ["."]
include = ["scripts*", "app*", "dashboard*"]

[tool.black]
line-length = 100
target-version = ['py310', 'py311', 'py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | venv
  | env
  | build
  | dist
)/
'''

[tool.flake8]
max-line-length = 100
ignore = ["E501", "W503"]
exclude = [
    ".git",
    "__pycache__",
    ".venv",
    "venv",
    "env",
    "build",
    "dist",
    "models",
    "data",
    ".mypy_cache",
    ".pytest_cache",
]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
exclude = [
    "models/",
    "data/",
    ".venv/",
    "venv/",
    "env/",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.pre-commit-hooks]
# This section is for reference; actual hooks are in .pre-commit-config.yaml
# See .pre-commit-config.yaml for the active configuration