name: "Bug Report"
description: "Report a bug to help us improve"
title: "[BUG] "
labels: ["bug"]
assignees: []
body:
  - type: markdown
    attributes:
      value: "Thanks for reporting a bug! Please fill out the sections below."
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: "When I run the training script with EfficientNetB0, it crashes with..."
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior
      placeholder: |
        1. Go to '...'
        2. Click on '....'
        3. Scroll down to '....'
        4. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen
      placeholder: "The model should train without errors..."
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened (include error messages, screenshots, or logs)
      placeholder: "Got error: ValueError: ..."
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating System
      placeholder: "e.g. macOS 14, Ubuntu 22.04, Windows 11"
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python Version
      placeholder: "e.g. 3.11.5"
    validations:
      required: true
  - type: input
    id: tensorflow
    attributes:
      label: TensorFlow Version
      placeholder: "e.g. 2.15.0"
    validations:
      required: true
  - type: input
    id: streamlit
    attributes:
      label: Streamlit Version
      placeholder: "e.g. 1.28.0"
    validations:
      required: true
  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Any other context about the problem (configuration, data, etc.)
      placeholder: "Config file used, data size, etc."