name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run linting (flake8)
        run: |
          flake8 scripts/ app/ dashboard/ --max-line-length=100 --ignore=E501,W503

      - name: Run type checking (mypy)
        run: |
          mypy scripts/ app/ dashboard/ --ignore-missing-imports || true

      - name: Check formatting (black)
        run: |
          black --check scripts/ app/ dashboard/

      - name: Verify imports
        run: |
          python -c "import scripts.train_model; import app.streamlit_app; import dashboard.dashboard; print('All imports OK')"

  test-training-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Test training script help
        run: |
          python scripts/train_model.py --help

      - name: Test collect_data script help
        run: |
          python scripts/collect_data.py --help

  validate-config:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Validate YAML config (if exists)
        run: |
          if [ -f config/training_config.yaml ]; then
            python -c "import yaml; yaml.safe_load(open('config/training_config.yaml')); print('Config YAML valid')"
          else
            echo "No config file found, skipping validation"
          fi

      - name: Validate JSON files
        run: python scripts/validate_json.py

  security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run pip-audit
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt || true

      - name: Check for secrets
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: main
          head: HEAD